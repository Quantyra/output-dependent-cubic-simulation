name: Manuscript package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify frozen package
        run: |
          python tools/check_package.py
          python tools/check_claims.py
      - name: Reproduce mathematical evidence in isolation
        run: python tools/reproduce.py
      - name: Validate metadata
        run: |
          python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
          curl --fail --location https://raw.githubusercontent.com/citation-file-format/citation-file-format/1.2.0/schema.json --output build/cff-schema-1.2.0.json
          python tools/check_metadata.py build/cff-schema-1.2.0.json
